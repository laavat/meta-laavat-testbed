# Glue layer for the AMD/Xilinx Zynq UltraScale+ MPSoC tier: the first non-NXP SoC.
#
# There is no laavat-hab bbappend here, and that is the point. Xilinx boot images are
# authenticated by bootgen with its own certificate format, so HAB does not exist on this
# machine. What is left is what meta-laavat claims is SoC-agnostic - FIT, RAUC, OP-TEE - and
# if that claim is true this layer is the same shape as every i.MX one.
#
# Recipe names settled with `bitbake -e`: virtual/kernel is linux-xlnx, virtual/bootloader
# is u-boot-xlnx, and the machine is zynqmp-generic (scarthgap meta-xilinx replaced the
# board-specific machines with System-Device-Tree generic ones).
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-xilinx-zynqmp"
BBFILE_PATTERN_sample-xilinx-zynqmp = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-xilinx-zynqmp = "10"

LAYERDEPENDS_sample-xilinx-zynqmp = "core rauc"
LAYERSERIES_COMPAT_sample-xilinx-zynqmp = "scarthgap"
