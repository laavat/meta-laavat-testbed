# Glue layer for the NXP i.MX6 SABRE-SD tier: the first non-i.MX8M SoC, and the first
# that is not aarch64.
#
# Recipe names settled with `bitbake -e`: virtual/kernel is linux-imx and
# virtual/bootloader is u-boot-imx, both under use-nxp-bsp. There is no imx-boot recipe
# on this machine, so the HAB target is the u-boot recipe itself.
#
# No optee bbappend: this machine's MACHINE_FEATURES does not carry optee, and turning it
# on changes UBOOT_CONFIG to "sd sd-optee", which builds two boot images.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-nxp-imx6"
BBFILE_PATTERN_sample-nxp-imx6 = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-nxp-imx6 = "10"

LAYERDEPENDS_sample-nxp-imx6 = "core rauc"
LAYERSERIES_COMPAT_sample-nxp-imx6 = "scarthgap"
