# Glue layer for the NXP i.MX8QM MEK tier: a second AHAB SoC, and a different one.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-nxp-imx8qm"
BBFILE_PATTERN_sample-nxp-imx8qm = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-nxp-imx8qm = "10"

LAYERDEPENDS_sample-nxp-imx8qm = "core rauc"
LAYERSERIES_COMPAT_sample-nxp-imx8qm = "scarthgap"
