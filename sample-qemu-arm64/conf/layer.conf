# Glue layer for the qemuarm64-secureboot tier: the machine `make qemu-demo` boots.
#
# Split out of sample-variscite-imx8mm, which used to carry both machines. Keeping them
# together meant this layer was in every tier's bblayers, so its u-boot-tools bbappend
# changed u-boot-tools for builds that had nothing to do with QEMU. Now it applies only
# where it is wanted.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-qemu-arm64"
BBFILE_PATTERN_sample-qemu-arm64 = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-qemu-arm64 = "10"

LAYERDEPENDS_sample-qemu-arm64 = "core rauc security"
LAYERSERIES_COMPAT_sample-qemu-arm64 = "scarthgap styhead walnascar whinlatter wrynose"
