# FIT verified boot for qemuarm64-secureboot.
#
# The machine's default boot path is U-Boot's bootflow scan, which reaches the kernel through
# the qfw bootmeth (QEMU fw_cfg) and boots a raw Image - it rejects a FIT outright with "Bad
# Linux ARM64 Image magic!", so no signature is ever checked. Boot the FIT explicitly instead:
# bootm is the command that verifies a FIT's signature against the key in the control DTB.
CONFIG_FIT=y
CONFIG_FIT_SIGNATURE=y
CONFIG_RSA=y
CONFIG_SPL_FIT_SIGNATURE=n
# No unsigned fallback: a legacy image or a raw Image must not be bootable, or the signature
# requirement is advisory rather than enforced.
CONFIG_LEGACY_IMAGE_FORMAT=n
# U-Boot on QEMU's virt machine takes its control FDT from the board (QEMU generates it),
# which is reported as "devicetree: board". The FIT verification key lives in U-Boot's OWN
# control DTB, so with a board-supplied FDT there is nowhere for the key to be and bootm
# fails with "Could not find configuration node". Embed U-Boot's own DTB instead.
CONFIG_OF_EMBED=y
# Name the configuration explicitly. With no #conf U-Boot selects by matching the board's
# compatible string, and poky's generated FIT gives conf-1 no compatible property, so the
# lookup fails with "Could not find configuration node" before any signature is checked.
# Pass the control FDT as bootm's third argument: this FIT carries a kernel only, and
# without an FDT the arm64 kernel never starts - U-Boot verifies the signature, then resets
# in a loop. "-" is the empty ramdisk slot.
# Load the FIT at 0x46000000, clear of the 0x40480000 kernel load address: the FIT is ~9MB
# and loading it at kernel_addr_r would have it overwritten by its own decompressed kernel.
CONFIG_BOOTCOMMAND="load virtio 0:1 0x46000000 /fitImage && bootm 0x46000000#conf-1 - ${fdtcontroladdr}"
CONFIG_USE_BOOTCOMMAND=y
