# The Yocto 5.3+ FIT glue for the QEMU tier, kept apart from sample-qemu-arm64.
#
# 5.3 moved the FIT out of the kernel recipe into linux-yocto-fitimage, so the bbappend
# names a recipe that does not exist on 5.2 and earlier - and a bbappend with no matching
# recipe is a hard error, not a no-op. A real integrator targets one release and simply
# writes one file or the other; only this test-bed spans releases, so only this test-bed
# needs the split.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-qemu-arm64-yocto53"
BBFILE_PATTERN_sample-qemu-arm64-yocto53 = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-qemu-arm64-yocto53 = "10"

LAYERDEPENDS_sample-qemu-arm64-yocto53 = "core"
LAYERSERIES_COMPAT_sample-qemu-arm64-yocto53 = "whinlatter wrynose"
