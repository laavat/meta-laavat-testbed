# Probe: does U-Boot verify a FIT on this machine at all?
#
# runqemu hands the kernel to QEMU via -kernel and U-Boot's qfw bootmeth loads it from
# fw_cfg. If that path goes through bootm, a signed fitImage gets its signature checked with
# no change to how the kernel is delivered. If it does not, the fitImage has to move into the
# boot partition and CONFIG_BOOTCOMMAND has to point at bootm - much more surgery.
#
# Local key on purpose: this probe asks whether U-Boot verifies, not who signed.
header:
  version: 14
  includes:
    - kas/qemu.yml

machine: qemuarm64-secureboot
target: core-image-minimal

local_conf_header:
  qemu-fit: |
    KERNEL_CLASSES:append = " kernel-fitimage"
    KERNEL_IMAGETYPE:qemuarm64-secureboot = "fitImage"
    UBOOT_SIGN_ENABLE = "1"
    UBOOT_SIGN_KEYDIR = "${TOPDIR}/keys/fit"
    UBOOT_SIGN_KEYNAME = "dev"
    FIT_GENERATE_KEYS = "1"
    FIT_SIGN_ALG = "rsa2048"
    FIT_HASH_ALG = "sha256"
    FIT_SIGN_INDIVIDUAL = "0"
    UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 2000"
    # Boot the FIT explicitly: the machine's qfw bootmeth boots a raw Image and rejects a
    # FIT, so nothing would verify a signature without this.
    LAAVAT_FIT_BOOT = "1"
    # QEMU virt RAM starts at 0x40000000. Without these poky derives a load address below
    # RAM (0x01314c40 was observed) and the kernel takes a synchronous abort while
    # decompressing - after the signature verifies, which makes it look like a boot problem
    # rather than an address problem.
    UBOOT_LOADADDRESS = "0x40480000"
    UBOOT_ENTRYPOINT = "0x40480000"
