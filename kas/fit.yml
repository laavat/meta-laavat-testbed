# FIT verified boot: kernel(+initramfs) as a configuration-signed fitImage (poky uboot-sign +
# kernel-fitimage), public key embedded into the U-Boot control DTB, which meta-freescale's
# imx-boot recipe already picks up when UBOOT_SIGN_ENABLE=1. Dev key generated by poky on
# first build into build/keys/fit/ (drop your own dev.key/dev.crt there instead if you like).
# NOTE: Variscite's imx8mm_var_dart_defconfig already sets CONFIG_FIT_SIGNATURE=y and
# CONFIG_LEGACY_IMAGE_FORMAT=y, so no U-Boot bbappend is needed. HAB is NOT applied to the FIT.
header:
  version: 14
  includes:
    - kas/base.yml

local_conf_header:
  fit: |
    UBOOT_SIGN_ENABLE = "1"
    UBOOT_SIGN_KEYDIR = "${TOPDIR}/keys/fit"
    UBOOT_SIGN_KEYNAME = "dev"
    FIT_GENERATE_KEYS = "1"
    FIT_SIGN_ALG = "rsa2048"
    FIT_HASH_ALG = "sha256"
    FIT_SIGN_INDIVIDUAL = "0"
    UBOOT_MKIMAGE_DTCOPTS = "-I dts -O dtb -p 2000"
    KERNEL_CLASSES:append = " kernel-fitimage"
    # variscite.inc sets KERNEL_IMAGETYPE:mx8-nxp-bsp = "Image.gz"; the machine-name override wins.
    KERNEL_IMAGETYPE:imx8mm-var-dart = "fitImage"
    # One control DTB only, so the pubkey-bearing u-boot.dtb is the one inside imx-boot
    # (single carrier-board DTB in imx-boot — same as Variscite's hab.bbclass).
    UBOOT_DTB_EXTRA = ""
