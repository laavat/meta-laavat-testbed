# Glue layer for the NXP i.MX93 EVK tier: the first SoC whose boot ROM is AHAB, not HABv4.
#
# The only difference from the i.MX8MM EVK layer next door is the boot-image bbappend:
# laavat-ahab instead of laavat-hab, and an explicit image path. FIT, RAUC and OP-TEE are
# byte-for-byte the same guarded inherits, because none of them touches the boot ROM.
#
# Recipe names settled with `bitbake -e`: linux-imx and u-boot-imx, as on the i.MX8MM EVK.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-nxp-imx93"
BBFILE_PATTERN_sample-nxp-imx93 = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-nxp-imx93 = "10"

LAYERDEPENDS_sample-nxp-imx93 = "core rauc"
LAYERSERIES_COMPAT_sample-nxp-imx93 = "scarthgap"
