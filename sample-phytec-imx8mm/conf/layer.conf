# Glue layer for the Phytec phyBOARD-Polis i.MX8MM tier: a third BSP, and the first from a
# vendor with no relationship to the other two. Written to test whether the class boundary
# holds where nothing is shared but the SoC.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-phytec-imx8mm"
BBFILE_PATTERN_sample-phytec-imx8mm = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-phytec-imx8mm = "10"

# Recipe names here were settled with `bitbake -e`, not read off the layer: on use-nxp-bsp
# this machine takes linux-phytec-imx and u-boot-phytec-imx (not linux-phytec/u-boot-imx),
# and its optee-os is meta-imx's 4.4.0.imx rather than meta-arm's 4.4.0.
LAYERDEPENDS_sample-phytec-imx8mm = "core rauc"
LAYERSERIES_COMPAT_sample-phytec-imx8mm = "scarthgap"
