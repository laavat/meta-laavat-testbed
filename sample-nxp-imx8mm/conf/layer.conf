# Glue layer for the NXP i.MX8MM EVK tier. The analog of sample-variscite-imx8mm, for a BSP
# this repo did not write - kept separate so neither layer can quietly lean on the other.
# Written from meta-laavat/docs/INTEGRATION.md.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-nxp-imx8mm"
BBFILE_PATTERN_sample-nxp-imx8mm = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-nxp-imx8mm = "10"

# Every bbappend here matches a recipe meta-freescale or meta-imx always provides on this
# machine, so unlike sample-variscite-imx8mm none of them needs BBFILES_DYNAMIC.
LAYERDEPENDS_sample-nxp-imx8mm = "core rauc"
LAYERSERIES_COMPAT_sample-nxp-imx8mm = "scarthgap"
