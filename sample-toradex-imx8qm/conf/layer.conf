# Glue layer for the Toradex Apalis iMX8 tier: i.MX8QM from a vendor that is not NXP.
#
# The point of this tier is the vendor axis on a SoC already covered. sample-nxp-imx8qm
# builds the same silicon from NXP's own MEK; this one uses Toradex's recipes throughout -
# linux-toradex and u-boot-toradex rather than linux-imx and u-boot-imx - and the AHAB
# bbappend is unchanged apart from the image name.
#
# Recipe names settled with `bitbake -e`.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-toradex-imx8qm"
BBFILE_PATTERN_sample-toradex-imx8qm = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-toradex-imx8qm = "10"

LAYERDEPENDS_sample-toradex-imx8qm = "core rauc"
LAYERSERIES_COMPAT_sample-toradex-imx8qm = "scarthgap"
