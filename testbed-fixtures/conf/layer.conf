# The test-bed's own fixtures. NOT an integration example: nothing here is something you
# write to adopt meta-laavat.
#
#   laavat-sign-smoke   a recipe whose only purpose is to be signed, so the plain
#                       laavat-sign path has a target that is not a kernel or a bootloader
#   laavat-boot-check   the on-device script the QEMU tier's boot harness greps for
#
# These lived in the Variscite sample layer and made the flagship example four times the
# size of the others, which read as "integrating requires writing a smoke test". It does
# not. Kept in a layer of their own so every sample-* layer is integration and nothing else.
# One copy of the demo key material, for the seven tiers that share it. Before this it was
# duplicated per sample layer: 21 files, so rotating the demo CA meant seven identical
# edits and six chances to miss one.
#
# := because LAYERDIR is rebound for every layer.conf bitbake parses; with = this would
# expand to whichever layer happened to be last.
#
# sample-variscite-imx8mm and sample-qemu-arm64 keep their own dev CA + signer pair (the
# device keyring for their dev-key tiers), but share the placeholder service CA from here.
# The dev keys are generated by scripts/gen-dev-keys.sh, never committed.
LAAVAT_DEVKEYS_DIR := "${LAYERDIR}/files/dev-keys"

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb"

BBFILE_COLLECTIONS += "testbed-fixtures"
BBFILE_PATTERN_testbed-fixtures = "^${LAYERDIR}/"
BBFILE_PRIORITY_testbed-fixtures = "10"

LAYERDEPENDS_testbed-fixtures = "core"
LAYERSERIES_COMPAT_testbed-fixtures = "scarthgap styhead walnascar whinlatter wrynose"
