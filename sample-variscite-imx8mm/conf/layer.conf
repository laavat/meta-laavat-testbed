# Glue layer for the Variscite VAR-SOM-MX8M-MINI tier.
#
# One machine, so a plain glob: every bbappend here matches a recipe the Variscite BSP
# always provides. This layer used to serve qemuarm64-secureboot as well, which forced
# BBFILES_DYNAMIC and an explicit per-directory BBFILES list, because a bbappend with no
# matching recipe is a hard error rather than a no-op. The QEMU half now lives in
# sample-qemu-arm64/, and both layers got simple as a result.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "sample-variscite-imx8mm"
BBFILE_PATTERN_sample-variscite-imx8mm = "^${LAYERDIR}/"
BBFILE_PRIORITY_sample-variscite-imx8mm = "10"

LAYERDEPENDS_sample-variscite-imx8mm = "core rauc security"
LAYERSERIES_COMPAT_sample-variscite-imx8mm = "scarthgap"
