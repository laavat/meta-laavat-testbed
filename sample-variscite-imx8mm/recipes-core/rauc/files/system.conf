# RAUC system configuration for the i.MX8MM signing test-bed.
# Slot devices are placeholders for an A/B eMMC layout (mmcblk2 = eMMC on DART-MX8M-MINI).
[system]
compatible=@@MACHINE@@
bootloader=uboot
bundle-formats=-plain

[keyring]
path=/etc/rauc/ca.cert.pem
# RaucBundleSigningWithOneTimeKey mints an ephemeral code-signing certificate per bundle.
# rauc defaults to the S/MIME purpose and rejects those with "unsuitable certificate
# purpose" even though the chain is valid - measured, not guessed.
check-purpose=codesign

[slot.rootfs.0]
device=/dev/mmcblk2p2
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk2p3
type=ext4
bootname=B
