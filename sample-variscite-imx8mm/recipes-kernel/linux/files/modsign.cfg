# Sign all modules at build time with an ephemeral key the kernel build generates itself
# (certs/signing_key.pem, default CONFIG_MODULE_SIG_KEY). Poky's kernel.bbclass copies the
# key into the shared workdir so out-of-tree modules are signed too.
# Known ceiling: modules restored from sstate after a kernel rebuild carry a stale signature;
# fixed-key alternative = meta-integrity kernel-modsign.bbclass.
CONFIG_MODULE_SIG=y
CONFIG_MODULE_SIG_ALL=y
CONFIG_MODULE_SIG_SHA256=y
CONFIG_MODULE_SIG_HASH="sha256"
CONFIG_MODULE_SIG_FORCE=y
